name: plant_project
description: "FarmSense - Smart Farming Assistant"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^8.3.7
  http: ^1.2.2
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.2
  flutter_svg: ^2.0.10+1
  path_drawing: ^1.0.1
  flutter_markdown: ^0.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Pin flutter_plugin_android_lifecycle to avoid the compileSdk 36 AAR metadata
# requirement introduced in 2.0.22+, which conflicts with file_picker 8.x (compileSdk 34).
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/
